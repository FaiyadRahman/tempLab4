    <script>
    const stylesheetRegex = /[^/]*\.css$/;

    function changeStylesheet(style){
        let element = document.getElementById("_stylesheet");
        element.setAttribute(
            "href",
            element.getAttribute("href").replace(stylesheetRegex, style)
        );
    }
    </script>
